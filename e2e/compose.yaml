# A two-instance cluster on NATS, built from this repository, for the end-to-end tests.
services:
  nats:
    image: nats:2

  app:
    build: ..
    image: frankenphp-websocket:e2e
    command: frankenphp run --config /etc/e2e/Caddyfile.app --adapter caddyfile
    environment:
      GODEBUG: http2xconnect=1
    volumes:
      - ./:/etc/e2e:ro
      - ./app:/app:ro
    working_dir: /app
    ports:
      - "18443:443"
      - "18443:443/udp"
    depends_on:
      - nats

  other:
    build: ..
    image: frankenphp-websocket:e2e
    command: frankenphp run --config /etc/e2e/Caddyfile.other --adapter caddyfile
    volumes:
      - ./:/etc/e2e:ro
      - ./app:/app:ro
    working_dir: /app
    ports:
      - "19443:443"
    depends_on:
      - nats
      - app

  browser:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    profiles: ["browser"]
    working_dir: /e2e/browser
    command: sh -c "npm install --no-audit --no-fund --no-package-lock && npx playwright test"
    environment:
      WEBSOCKET_ORIGIN: https://app
    volumes:
      - ./browser:/e2e/browser
      - /e2e/browser/node_modules
    depends_on:
      - app
